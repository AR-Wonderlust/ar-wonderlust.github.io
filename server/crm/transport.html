<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ROMA · Presupuestos</title><style>
:root{font:16px/1.5 system-ui,sans-serif;color:#24352d;background:#f4f1eb}*{box-sizing:border-box}body{margin:0}header{background:#233e34;color:white;padding:25px max(24px,5vw)}header h1{margin:0;font:36px Georgia,serif}header p{margin:6px 0;color:#d6dfd7}main{max-width:1280px;margin:auto;padding:24px}button,input,select,textarea{font:inherit}button{background:#a34732;color:white;border:0;border-radius:6px;padding:10px 16px;cursor:pointer}button:disabled{opacity:.5;cursor:wait}button.secondary{background:#e5e2d9;color:#24352d}nav{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}nav button[aria-pressed=true]{background:#233e34}h2{font:30px Georgia,serif;margin:0 0 18px}h3{margin:0 0 8px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}.card,section{background:#fffdfa;border:1px solid #ded7ca;border-radius:10px;padding:20px;margin-bottom:20px}.card b{display:block;font-size:34px}.muted{color:#68746c;font-size:14px}.split{display:grid;grid-template-columns:1fr 1fr;gap:20px}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:12px;border-bottom:1px solid #e8e2d8;vertical-align:top}th{color:#657367;font-size:12px;text-transform:uppercase}td button{font-size:13px;padding:6px 10px}.status{padding:4px 8px;border-radius:10px;background:#e6eee5;white-space:nowrap}#message{min-height:24px;color:#9b3924}label{display:block;margin:12px 0 4px;font-weight:600}input,select,textarea{width:100%;padding:10px;border:1px solid #b8c0b7;border-radius:5px;background:white;color:#24352d}textarea{min-height:130px;resize:vertical}input[type=checkbox]{width:auto}select[multiple]{min-height:145px}dialog{width:min(760px,94vw);max-height:90vh;border:1px solid #b8c0b7;border-radius:12px;padding:24px;overflow:auto}dialog::backdrop{background:#12271c99}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f4f1eb;padding:14px;border-radius:8px;max-height:200px;overflow:auto}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}[hidden]{display:none!important}.pager{display:flex;gap:12px;align-items:center;padding-top:16px}a{color:#a34732}:focus-visible{outline:3px solid #cc982e;outline-offset:3px}@media(max-width:700px){.split{grid-template-columns:1fr}main{padding:15px}.card{padding:14px}header h1{font-size:28px}}
</style><script src="/transport.js" defer></script><body><header><h1>Presupuestos de transporte</h1><p>Precio por vehículo · Chofer y combustible incluidos</p></header><main><a href="/">Volver a Gestión comercial</a><p id="message" role="status"></p><section><h2>Nuevo borrador</h2><p id="rates"></p><form id="quote"><label>Consulta del CRM<select id="enquiry" required></select></label><p id="context"></p><div id="legs"></div><button id="add" type="button">Agregar tramo / vehículo</button><label>Adicionales ARS<input id="extras" type="number" min="0" step="0.01" value="0" required></label><label>Detalle de adicionales<input id="extra-detail" maxlength="1000"></label><label>Válido hasta<input id="valid" type="date" required></label><label>Condiciones para el pasajero<textarea id="conditions" required maxlength="3000">Incluye chofer y combustible. Servicio sujeto a confirmación de disponibilidad.</textarea></label><label><input type="checkbox" id="multiple"> La contratación incluye varios viajes</label><label>Motivo de descuento (si corresponde)<input id="reason" maxlength="1000"></label><button type="submit" id="save">Calcular y guardar borrador</button></form></section><section><h2>Últimos 100 presupuestos</h2><p>Los borradores guardados son inmutables. Para corregir uno, creá otro. Aprobar no reserva vehículos ni envía mensajes.</p><button id="reload">Actualizar</button><div id="list"></div></section></main></body></html>
